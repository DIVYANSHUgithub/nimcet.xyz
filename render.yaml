# Free deployment preview. Existing Supabase database is reused.
# Configure the two prompted environment values in Render, never in Git.
services:
  - type: web
    name: nimcet-api-preview
    runtime: docker
    plan: free
    region: singapore
    branch: codex/student-mvp-deploy
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_URL
        value: https://wcxxyyebcgofziylgwdg.supabase.co
      - key: SUPABASE_JWT_ISSUER
        value: https://wcxxyyebcgofziylgwdg.supabase.co/auth/v1
      - key: SUPABASE_JWKS_URL
        value: https://wcxxyyebcgofziylgwdg.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWT_MODE
        value: jwks
      - key: SUPABASE_JWT_ALGORITHM
        value: ES256
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_ROOT_CERT
        value: certs/supabase-ca.crt
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_ROLE_LOOKUP_ENABLED
        value: "true"
      - key: TEST_ENGINE_ENABLED
        value: "true"
      - key: QUESTION_AUTHORING_ENABLED
        value: "false"
      - key: PHASE5_ENABLED
        value: "false"
      - key: ADMIN_WORKFLOWS_ENABLED
        value: "false"
